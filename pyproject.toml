[project]
name = "nova-commander"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Namra", email = "namraramsha@yahoo.com" },
    { name = "kabir", email = "kabirkakdiya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=41.0.0",
    "httpx>=0.27.0",
    "paramiko>=2.12.0",
    "pyqt6>=6.6.0",
    "pyte>=0.8.2",
    "pytest>=8.0.0",
    "watchdog>=4.0.0",
]

[project.scripts]
nova-commander = "nova_commander:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
