name: Build & Package All Platforms (Linux, macOS, Windows)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. LINUX BUILD (.deb & Standalone Binary)
  # =========================================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1-mesa-glx dpkg-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run Tests
        run: |
          QT_QPA_PLATFORM=offscreen pytest winscp_linux/tests/ -v

      - name: Build Debian Package (.deb)
        run: |
          python scripts/build_deb.py

      - name: Build Standalone Linux Executable
        run: |
          pyinstaller winscp.spec

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winscp-linux-x86_64
          path: |
            winscp-linux_*.deb
            dist/winscp-linux*
            dist/WinSCP-Linux

  # =========================================================================
  # 2. MACOS BUILD (.app & .dmg)
  # =========================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run Tests
        run: |
          QT_QPA_PLATFORM=offscreen pytest winscp_linux/tests/ -v

      - name: Build macOS Application Bundle & DMG
        run: |
          python scripts/build_macos.py

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winscp-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip

  # =========================================================================
  # 3. WINDOWS BUILD (.exe & Setup Installer)
  # =========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run Tests
        run: |
          pytest winscp_linux/tests/ -v

      - name: Build Standalone Windows Executable
        run: |
          python scripts/build_windows.py

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/windows_installer.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winscp-windows-x64
          path: |
            dist/WinSCP.exe
            scripts/Output/WinSCP-Setup-*.exe

  # =========================================================================
  # 4. GITHUB RELEASE (On Tag Push)
  # =========================================================================
  release:
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            winscp-linux-x86_64/*.deb
            winscp-macos-universal/*.dmg
            winscp-macos-universal/*.zip
            winscp-windows-x64/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
