<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2430" />
      <stop offset="100%" stop-color="#12151c" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <!-- Left Pane (Local) Gradient -->
    <linearGradient id="leftPaneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232936" />
      <stop offset="100%" stop-color="#1a1e27" />
    </linearGradient>

    <!-- Right Pane (Remote SFTP) Gradient -->
    <linearGradient id="rightPaneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2c3f" />
      <stop offset="100%" stop-color="#16202e" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>

    <!-- Green Accent Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Blue Accent Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="lockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="100" ry="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#shadow)" />

  <!-- Dual Commander Panes Group -->
  <!-- Left Pane (Local) -->
  <rect x="52" y="76" width="188" height="320" rx="14" ry="14" fill="url(#leftPaneGrad)" stroke="#333d4e" stroke-width="2.5" />
  <!-- Left Pane Header -->
  <path d="M 52,90 A 14,14 0 0 1 66,76 L 226,76 A 14,14 0 0 1 240,90 L 240,118 L 52,118 Z" fill="#2d3748" />
  <circle cx="72" cy="97" r="5" fill="#ef4444" />
  <circle cx="88" cy="97" r="5" fill="#f59e0b" />
  <circle cx="104" cy="97" r="5" fill="#10b981" />
  <rect x="126" y="92" width="94" height="10" rx="4" fill="#4a5568" />
  <!-- Left Pane File Items -->
  <rect x="70" y="140" width="150" height="12" rx="3" fill="#4ec9b0" opacity="0.8" />
  <rect x="70" y="168" width="110" height="10" rx="3" fill="#718096" opacity="0.6" />
  <rect x="70" y="194" width="135" height="10" rx="3" fill="#718096" opacity="0.6" />
  <rect x="70" y="220" width="95" height="10" rx="3" fill="#718096" opacity="0.6" />
  <rect x="70" y="246" width="140" height="10" rx="3" fill="#718096" opacity="0.6" />
  <rect x="70" y="272" width="120" height="10" rx="3" fill="#718096" opacity="0.6" />

  <!-- Right Pane (Remote SFTP) -->
  <rect x="272" y="76" width="188" height="320" rx="14" ry="14" fill="url(#rightPaneGrad)" stroke="#2563eb" stroke-width="2.5" />
  <!-- Right Pane Header -->
  <path d="M 272,90 A 14,14 0 0 1 286,76 L 446,76 A 14,14 0 0 1 460,90 L 460,118 L 272,118 Z" fill="#1e3a8a" />
  <!-- Remote Indicator / Host Label -->
  <circle cx="292" cy="97" r="5" fill="#38bdf8" />
  <rect x="308" y="92" width="132" height="10" rx="4" fill="#3b82f6" opacity="0.7" />
  <!-- Right Pane File Items -->
  <rect x="290" y="140" width="130" height="12" rx="3" fill="#38bdf8" opacity="0.8" />
  <rect x="290" y="168" width="145" height="10" rx="3" fill="#64748b" opacity="0.6" />
  <rect x="290" y="194" width="105" height="10" rx="3" fill="#64748b" opacity="0.6" />
  <rect x="290" y="220" width="135" height="10" rx="3" fill="#64748b" opacity="0.6" />
  <rect x="290" y="246" width="115" height="10" rx="3" fill="#64748b" opacity="0.6" />
  <rect x="290" y="272" width="140" height="10" rx="3" fill="#64748b" opacity="0.6" />

  <!-- Bidirectional Transfer Arrows in Center -->
  <!-- Upload Arrow (Left to Right, Green) -->
  <g filter="url(#shadow)">
    <path d="M 210,185 L 276,185 L 276,172 L 306,197 L 276,222 L 276,209 L 210,209 Z" fill="url(#greenGrad)" stroke="#111827" stroke-width="2" />
  </g>
  <!-- Download Arrow (Right to Left, Blue) -->
  <g filter="url(#shadow)">
    <path d="M 302,245 L 236,245 L 236,232 L 206,257 L 236,282 L 236,269 L 302,269 Z" fill="url(#blueGrad)" stroke="#111827" stroke-width="2" />
  </g>

  <!-- Golden SSH Security Padlock in Bottom Center -->
  <g filter="url(#lockShadow)" transform="translate(256, 360)">
    <!-- Shackle -->
    <path d="M -32,-30 C -32,-60 32,-60 32,-30 L 32,-8 L -32,-8 Z" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="-46" y="-12" width="92" height="74" rx="14" ry="14" fill="url(#goldGrad)" stroke="#b45309" stroke-width="3" />
    <!-- Keyhole -->
    <circle cx="0" cy="18" r="9" fill="#1e2430" />
    <path d="M -5,22 L 5,22 L 7,42 L -7,42 Z" fill="#1e2430" />
  </g>
</svg>
